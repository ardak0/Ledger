name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run on the same branch instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # `verify` runs the whole suite against real PostgreSQL via Testcontainers, never H2. The runner's Docker
      # daemon is also needed at compile time: jOOQ classes are generated from the migrated schema in a
      # throwaway Postgres container (see the pom). The slow benchmark is excluded; it only runs with -Pbenchmark.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
