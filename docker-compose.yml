# Local development. Keep the db image tag in sync with <postgres.image> in pom.xml.
#
#   db only (run the app from your IDE / `./mvnw spring-boot:run`):   docker compose up -d db
#   db + app with the live demo at http://localhost:8080/demo:         ./mvnw -DskipTests package && docker compose up --build
#
# The app service enables the `demo` profile, which exposes /demo and a switch that makes the demo's own transfers
# deadlock ON PURPOSE (the /transfers API is never affected). That is right for a local demo and wrong anywhere else:
# remove SPRING_PROFILES_ACTIVE for a production-like run.
services:
  db:
    image: postgres:17-alpine
    # deadlock_timeout: Postgres only looks for a deadlock after a lock wait lasts this long (default
    # 1s). Lowered so the /demo page shows deadlocks resolving within a fraction of a second. It
    # finds the same real cycles sooner; it cannot invent false ones. Production keeps the default.
    command: ["postgres", "-c", "deadlock_timeout=100ms"]
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "${LEDGER_DB_PORT:-5432}:5432"
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledger
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"

volumes:
  ledger-pgdata:
