# Local development database. Keep the image tag in sync with <postgres.image> in pom.xml.
services:
  db:
    image: postgres:17-alpine
    # deadlock_timeout: Postgres only looks for a deadlock after a lock wait lasts this long (default
    # 1s). Lowered so the /demo page shows deadlocks resolving within a fraction of a second. It
    # finds the same real cycles sooner; it cannot invent false ones. Production keeps the default.
    command: ["postgres", "-c", "deadlock_timeout=100ms"]
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "${LEDGER_DB_PORT:-5432}:5432"
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  ledger-pgdata:
